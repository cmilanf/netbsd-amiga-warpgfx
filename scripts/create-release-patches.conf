# WarpGFX target release manifest.
#
# One record per line: LABEL|SRC_COMMIT|XSRC_COMMIT
#   LABEL        directory-safe release name (no whitespace or wildcards).
#   SRC_COMMIT   full 40-character NetBSD src commit ID.
#   XSRC_COMMIT  full 40-character NetBSD xsrc commit ID.
#
# Blank lines and lines beginning with '#' are ignored. The upstream mirror
# URLs and managed path lists come from canonical-patch-config.sh; only the
# per-release base commits live here.
#
# Commits were resolved from the GitHub mirrors, which expose branches rather
# than release tags. The version string in sys/sys/param.h at each commit is
# noted for provenance:
#   netbsd-10.1      branch netbsd-10, __NetBSD_Version__ 10.1_STABLE
#   netbsd-11.0      branch netbsd-11, __NetBSD_Version__ 11.0_STABLE
#   netbsd-current   branch HEAD,      __NetBSD_Version__ 11.99.8
# Branch heads move over time; the commit IDs below pin an exact point.
#
# netbsd-11.0 tracks the netbsd-11 release branch after the 11.0 release of
# 2026-07-30, so it carries the post-release pull-ups that a system kept up to
# date with the 11.0 stable branch has; param.h there reads 11.0_STABLE. To
# build against the untouched 11.0 release point instead, repin src to
# 7d25f256a2826e0a1945771090aceb98f7d2cf72 ("Welcome to 11.0!", param.h 11.0)
# and xsrc to 6ae477271c420cdacae3c18ea6fcf41cc6b9c67d.
#
# netbsd-10.1 is intentionally disabled. NetBSD 10.1 predates the ZZ9000
# (zz9k_fb) framebuffer driver, next to which the canonical trunk-based patch
# places its WarpGFX hunks. The three-way rebase therefore conflicts in
# conf.c, WSCONS, files.amiga, and zbus.c. The WarpGFX changes themselves are
# ~30 additive lines and could be hand-resolved, but doing so would require a
# stored, hand-maintained resolution re-checked on every canonical change,
# breaking the clean "rebase-and-verify" invariant this generator relies on.
# The 11.x line (11.0 and -current) is what the driver is developed and
# tested against (MAD-A1200 runs 11.99.x). To re-enable 10.1, uncomment the
# line below and add a maintained-exception path to create-release-patches.sh.
